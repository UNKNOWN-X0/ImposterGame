# What runs on a push, so that nobody has to remember to run it.
#
# Two jobs, because they cost very different amounts. The first needs nothing
# but Node and takes seconds; the second downloads a browser and plays whole
# games in it, and is the one that has actually caught crashes on the way to
# a phone.
#
# There is no lockfile in this project, so these use `npm install` rather than
# `npm ci`. Add a package-lock.json and both can switch.

name: checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm test

      # Coverage reporting needs Node 22, so the floors are checked once
      # rather than on every version in the matrix.
      - name: coverage floors
        if: matrix.node == '22'
        run: npm run coverage

  browser:
    name: every screen and every ending
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run screens
      - run: npm run endings
